<!doctype html>
<html lang="en" data-appearance="system" data-accent="sunset">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Daybook</title>
    <meta name="description" content="Tasks, calendar, people, journal and an AI assistant in one place." />
    <meta name="color-scheme" content="light dark" />

    <!-- Apply the saved theme before first paint (no light flash in dark mode). -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('daybook.data.settings') || '{}') || {}
        var a = ['system', 'light', 'dark'].indexOf(s.appearance) >= 0 ? s.appearance : (s.darkMode ? 'dark' : 'system')
        document.documentElement.dataset.appearance = a
        // Theme ids: keep in sync with ACCENTS in src/lib/theme.js.
        if (['sunset', 'forest', 'midnight', 'lagoon', 'glacier', 'blossom', 'aurora', 'honey', 'citrus', 'neon', 'mocha', 'graphite'].indexOf(s.theme) >= 0) document.documentElement.dataset.accent = s.theme
        if (a !== 'system') document.addEventListener('DOMContentLoaded', function () {
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.removeAttribute('media'); m.setAttribute('content', a === 'dark' ? '#000000' : '#F2F2F7') })
        })
      } catch (e) {}
    </script>

    <!-- PWA / iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Daybook" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="format-detection" content="telephone=no" />
    <!-- iOS colours the status bar from theme-color; theme.js keeps it in sync with the app theme. -->
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- Inter, only where it's used: Apple devices show their system font (see --font), so iPhones and
         Macs skip the extra connections. Loaded without blocking the first render. -->
    <script>
      if (!/Mac|iPhone|iPad|iPod/.test(navigator.userAgent)) {
        var inter = document.createElement('link')
        inter.rel = 'stylesheet'
        inter.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap'
        document.head.appendChild(inter)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Daybook needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
