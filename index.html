<!doctype html>
<html lang="en" data-appearance="system" data-accent="sunset">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Daybook</title>
    <meta name="description" content="Tasks, calendar, people, journal and an AI assistant in one place." />
    <meta name="color-scheme" content="light dark" />

    <!-- Apply the saved theme before first paint (no light flash in dark mode). -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('daybook.data.settings') || '{}') || {}
        var a = ['system', 'light', 'dark'].indexOf(s.appearance) >= 0 ? s.appearance : (s.darkMode ? 'dark' : 'system')
        document.documentElement.dataset.appearance = a
        // Theme ids: keep in sync with ACCENTS in src/lib/theme.js.
        if (['sunset', 'forest', 'midnight', 'lagoon', 'glacier', 'blossom', 'aurora', 'honey', 'citrus', 'neon', 'mocha', 'graphite'].indexOf(s.theme) >= 0) document.documentElement.dataset.accent = s.theme
        // Signed in: show the launch shell (below) until the app draws itself.
        if (localStorage.getItem('daybook.session.token')) document.documentElement.classList.add('boot-shell')
        if (a !== 'system') document.addEventListener('DOMContentLoaded', function () {
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.removeAttribute('media'); m.setAttribute('content', a === 'dark' ? '#000000' : '#F2F2F7') })
        })
      } catch (e) {}
    </script>

    <!-- PWA / iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Daybook" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Launch images for the Home Screen app: the page colour plus the tab-bar capsule, drawn by
         scripts/make_launch.py to match .boot-nav below. One per Face ID iPhone size and scheme. -->
    <link rel="apple-touch-startup-image" href="/launch/launch-1125x2436-light.png" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1125x2436-dark.png" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1170x2532-light.png" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1170x2532-dark.png" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1179x2556-light.png" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1179x2556-dark.png" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1206x2622-light.png" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1206x2622-dark.png" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1260x2736-light.png" media="screen and (device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1260x2736-dark.png" media="screen and (device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1284x2778-light.png" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1284x2778-dark.png" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1290x2796-light.png" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1290x2796-dark.png" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1320x2868-light.png" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1320x2868-dark.png" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="format-detection" content="telephone=no" />
    <!-- iOS colours the status bar from theme-color; theme.js keeps it in sync with the app theme. -->
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- Launch shell: what shows until the app's first render replaces #root (src/main.jsx). The page
         colour follows the theme set above, so the home-screen app never opens on a white flash.
         Only for someone signed in (the auth screen looks nothing like it). Self-contained: the
         app's own styles may not be there yet. -->
    <style>
      html { background: #F2F2F7; }
      html[data-appearance='dark'] { background: #000000; }
      @media (prefers-color-scheme: dark) { html[data-appearance='system'] { background: #000000; } }
      .boot { display: none; }
      html.boot-shell .boot {
        --b-bg: #F2F2F7; --b-card: #FFFFFF; --b-fill: rgba(120, 120, 128, 0.14);
        --b-glass: rgba(255, 255, 255, 0.82); --b-edge: rgba(255, 255, 255, 0.7); --b-shadow: 0 10px 34px rgba(30, 36, 56, 0.12);
        display: block; position: fixed; inset: 0; overflow: hidden; background: var(--b-bg); pointer-events: none;
      }
      html[data-appearance='dark'].boot-shell .boot {
        --b-bg: #000000; --b-card: #1C1C1E; --b-fill: rgba(120, 120, 128, 0.28);
        --b-glass: rgba(36, 36, 38, 0.82); --b-edge: rgba(255, 255, 255, 0.14); --b-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      }
      @media (prefers-color-scheme: dark) {
        html[data-appearance='system'].boot-shell .boot {
          --b-bg: #000000; --b-card: #1C1C1E; --b-fill: rgba(120, 120, 128, 0.28);
          --b-glass: rgba(36, 36, 38, 0.82); --b-edge: rgba(255, 255, 255, 0.14); --b-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
      }
      .boot-top { display: flex; align-items: center; justify-content: space-between; height: 56px; padding: env(safe-area-inset-top, 0px) 16px 0; }
      .boot-round { width: 40px; height: 40px; border-radius: 50%; background: var(--b-glass); border: 1px solid var(--b-edge); box-shadow: var(--b-shadow); box-sizing: border-box; }
      .boot-page { max-width: 780px; margin: 0 auto; padding: 20px 16px 0; box-sizing: border-box; }
      .boot-line { display: block; height: 14px; border-radius: 7px; background: var(--b-fill); }
      .boot-title { width: 46%; max-width: 220px; height: 34px; border-radius: 10px; margin-bottom: 10px; }
      .boot-sub { width: 32%; max-width: 160px; margin-bottom: 20px; }
      .boot-card { display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; padding: 20px 16px; border-radius: 26px; background: var(--b-card); }
      .boot-card .boot-line:nth-child(1) { width: 38%; height: 17px; }
      .boot-card .boot-line:nth-child(2) { width: 88%; }
      .boot-card .boot-line:nth-child(3) { width: 72%; }
      .boot-card .boot-line:nth-child(4) { width: 80%; }
      .boot-nav {
        position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); transform: translateX(-50%);
        width: min(460px, calc(100% - 24px)); height: 60px; border-radius: 999px; box-sizing: border-box;
        background: var(--b-glass); border: 1px solid var(--b-edge); box-shadow: var(--b-shadow);
      }
      @media (min-width: 640px) { .boot-top, .boot-page { padding-left: 24px; padding-right: 24px; } }
      /* Desktop: a sidebar panel instead of the tab bar, no top bar. */
      @media (min-width: 900px) {
        .boot-top { display: none; }
        .boot-page { margin: 0 0 0 252px; padding: 36px 32px 0; /* the app's main column: 12 + 240 sidebar, then .page's 32px */ }
        .boot-nav { left: 12px; top: 12px; bottom: 12px; transform: none; width: 240px; height: auto; border-radius: 28px; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true">
        <div class="boot-top"><span class="boot-round"></span><span class="boot-round"></span></div>
        <div class="boot-page">
          <span class="boot-line boot-title"></span>
          <span class="boot-line boot-sub"></span>
          <div class="boot-card"><span class="boot-line"></span><span class="boot-line"></span><span class="boot-line"></span><span class="boot-line"></span></div>
          <div class="boot-card"><span class="boot-line"></span><span class="boot-line"></span><span class="boot-line"></span></div>
        </div>
        <div class="boot-nav"></div>
      </div>
    </div>
    <noscript>Daybook needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
